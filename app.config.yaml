application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      aco-sfcc-starter-kit:
        license: Apache-2.0
        actions:
          # Please DO NOT DELETE this action; future functionalities planned for upcoming starter kit releases may stop working.
          info:
            function: actions/info/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true
      spa:
        license: Apache-2.0
        actions:
          $include: ./actions/spa/actions.config.yaml
        inputs:
          $include: ./actions/inputs.yaml
      full-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/full/external/actions.config.yaml
      delta-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/delta/external/actions.config.yaml
        # The following configures the delta-backoffice action
        # to run on a cron schedule (ie. every hour at :15 minutes).
        # Adjust this schedule as needed.
        triggers:
          everyHour:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: 15 * * * *
              trigger_payload:
                type: sfcc.delta.sync
                data: {}
        rules:
          everyHourRule:
            trigger: everyHour
            action: delta-backoffice/consumer
      metadata-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/metadata/external/actions.config.yaml
      product-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/product/external/actions.config.yaml
      priceBook-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/price-book/external/actions.config.yaml
      category-backoffice:
        license: Apache-2.0
        inputs:
          $include: ./actions/inputs.yaml
        actions:
          $include: ./actions/category/external/actions.config.yaml
